name: CI

# Dal gönderimleri PR'larda da durum olarak görünür; ayrıca pull_request tetikleyicisi çift çalışma yaratırdı.
on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: Çekirdek testleri (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: swift build
      - name: Testler
        run: swift test
      - name: Komut satırı uçtan uca testi
        run: ./Scripts/e2e_cli.sh .build/debug/EnvanterTool

  macos:
    name: Uygulama, testler ve ekran görüntüleri (macOS)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Araç sürümleri
        run: swift --version && sw_vers
      - name: Derle (uygulama dahil)
        run: swift build
      - name: Testler
        run: swift test
      - name: Uygulama paketi (.app + .zip)
        run: ./Scripts/build_app.sh
      - name: Dağıtım paketini yükle
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-Envanter
          path: build/NextGen-Envanter-*.zip
      - name: Komut satırı uçtan uca testi
        run: ./Scripts/e2e_cli.sh "build/NextGen Envanter.app/Contents/MacOS/EnvanterTool"
      - name: Uygulama içi sistem testi (gerçek arayüz durumu üzerinden)
        run: |
          APP="build/NextGen Envanter.app/Contents/MacOS"
          # Uygulamanın kendi deposu da geçici klasörü kullansın; test kendi geçici verisinde çalışır
          export ENVANTER_DATA_DIR="$RUNNER_TEMP/selftest-app"
          export ENVANTER_SELFTEST=1
          perl -e 'alarm 300; exec { $ARGV[0] } @ARGV or die "çalıştırılamadı: $!\n"' "$APP/Envanter" | tee "$RUNNER_TEMP/selftest.log"
          grep -q "SELFTEST: .* 0 başarısız" "$RUNNER_TEMP/selftest.log"

      - name: Demo verisiyle ekran görüntüleri
        run: |
          APP="build/NextGen Envanter.app/Contents/MacOS"
          TODAY=$(date +%Y-%m-%d)
          "$APP/EnvanterTool" demo --data-dir "$RUNNER_TEMP/demo" --date "$TODAY"
          export ENVANTER_DATA_DIR="$RUNNER_TEMP/demo"
          export ENVANTER_SNAPSHOT_DIR="$RUNNER_TEMP/shots"
          export ENVANTER_DATE="$TODAY"
          export ENVANTER_SNAPSHOT_SIZE="1440x1000"
          export ENVANTER_SECTIONS="overview,daily,sales,orders,labor,summary,analytics:general,analytics:item:patates,analytics:abc,analytics:menu,recipes:11101,items,backup,help"
          export ENVANTER_QUIT_AFTER_SNAPSHOT=1
          # exec { $ARGV[0] } liste biçimi: yol içindeki boşluk ("NextGen Envanter.app") kelimelere bölünmesin
          perl -e 'alarm 300; exec { $ARGV[0] } @ARGV or die "çalıştırılamadı: $!\n"' "$APP/Envanter" || echo "Uygulama çıkış kodu: $?"
          ls -la "$RUNNER_TEMP/shots"
          test "$(ls "$RUNNER_TEMP/shots" | wc -l)" -ge 14
      - name: Ekran görüntülerini yükle
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: ${{ runner.temp }}/shots/*.png
      - name: Ekran görüntülerini dala işle (yalnızca claude/* dalları)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        run: |
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          cp "$RUNNER_TEMP"/shots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Ekran görüntüleri: demo verisiyle otomatik ($GITHUB_SHA)"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || echo "Dal ilerlemiş; görüntüler artifact olarak yüklendi."
